<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Serie A Simulador PRO</title>

<style>
body { font-family: Arial; padding:20px; background:#f4f4f4; }
h1,h2 { text-align:center; }
table { width:100%; border-collapse:collapse; margin-top:20px; }
th,td { border:1px solid #ddd; padding:8px; text-align:center; }
th { background:#111; color:white; }

tr:nth-child(even){ background:#f9f9f9; }
tr.champions{ background:#c6f0c6; }
tr.europa{ background:#c6d8ff; }
tr.descenso{ background:#f9c6c6; }

input,select,button{ padding:5px; margin:5px; }

#campeon{
 text-align:center;
 color:gold;
 font-weight:bold;
}

@keyframes blink {
 from{ transform:scale(1); }
 to{ transform:scale(1.1); }
}
</style>
</head>

<body>

<h1>Serie A - Simulador Profesional</h1>

<table id="tablaPosiciones">
<thead>
<tr>
<th>#</th><th>Equipo</th><th>PJ</th><th>G</th><th>E</th><th>P</th>
<th>GF</th><th>GC</th><th>DG</th><th>PTS</th>
</tr>
</thead>
<tbody></tbody>
</table>

<h2 id="campeon"></h2>

<div style="text-align:center;">
<button id="resetTabla">Reiniciar Liga</button>
</div>

<h2>Ingresar Resultado</h2>
<form id="formResultado" style="text-align:center;">
<select id="local"></select>
<input type="number" id="golesLocal" min="0" required>
VS
<input type="number" id="golesVisitante" min="0" required>
<select id="visitante"></select>
<button type="submit">Agregar</button>
</form>

<h2>Partidos Restantes</h2>
<ul id="faltantes"></ul>

<h2>Goleadores</h2>
<table id="tablaGoleadores">
<thead>
<tr>
<th>Jugador</th><th>PJ</th><th>Goles</th><th>Asistencias</th>
</tr>
</thead>
<tbody></tbody>
</table>

<script>

const equipos = [
"Inter Milan","AC Milan","Napoli","Roma","Juventus","Bologna",
"Como","Lazio","Sassuolo","Udinese","Cremonese","Atalanta",
"Torino","Lecce","Cagliari","Genoa","Parma","Hellas Verona",
"Pisa","Fiorentina"
];

// 🔥 DATOS ACTUALIZADOS HASTA FECHA 25
let tabla = [
{nombre:"Juventus", PJ:25,G:25,E:0,P:0,GF:152,GC:28,DG:124,PTS:75},
{nombre:"Napoli", PJ:25,G:18,E:5,P:2,GF:58,GC:25,DG:33,PTS:59},
{nombre:"Inter Milan", PJ:25,G:17,E:6,P:2,GF:60,GC:30,DG:30,PTS:57},
{nombre:"AC Milan", PJ:25,G:16,E:5,P:4,GF:55,GC:28,DG:27,PTS:53},
{nombre:"Roma", PJ:25,G:14,E:6,P:5,GF:49,GC:30,DG:19,PTS:48},
{nombre:"Atalanta", PJ:25,G:13,E:6,P:6,GF:46,GC:35,DG:11,PTS:45},
{nombre:"Lazio", PJ:25,G:12,E:7,P:6,GF:40,GC:30,DG:10,PTS:43},
{nombre:"Bologna", PJ:25,G:10,E:8,P:7,GF:38,GC:32,DG:6,PTS:38},
{nombre:"Torino", PJ:25,G:10,E:5,P:10,GF:33,GC:30,DG:3,PTS:35},
{nombre:"Genoa", PJ:25,G:9,E:6,P:10,GF:30,GC:35,DG:-5,PTS:33},
{nombre:"Udinese", PJ:25,G:8,E:7,P:10,GF:28,GC:34,DG:-6,PTS:31},
{nombre:"Fiorentina", PJ:25,G:8,E:6,P:11,GF:27,GC:36,DG:-9,PTS:30},
{nombre:"Parma", PJ:25,G:7,E:6,P:12,GF:25,GC:40,DG:-15,PTS:27},
{nombre:"Sassuolo", PJ:25,G:7,E:5,P:13,GF:26,GC:42,DG:-16,PTS:26},
{nombre:"Cagliari", PJ:25,G:6,E:6,P:13,GF:22,GC:38,DG:-16,PTS:24},
{nombre:"Lecce", PJ:25,G:6,E:5,P:14,GF:21,GC:41,DG:-20,PTS:23},
{nombre:"Como", PJ:25,G:5,E:6,P:14,GF:20,GC:44,DG:-24,PTS:21},
{nombre:"Cremonese", PJ:25,G:5,E:5,P:15,GF:19,GC:46,DG:-27,PTS:20},
{nombre:"Hellas Verona", PJ:25,G:4,E:6,P:15,GF:18,GC:45,DG:-27,PTS:18},
{nombre:"Pisa", PJ:25,G:3,E:5,P:17,GF:16,GC:50,DG:-34,PTS:14}
];

let partidos=[];
for(let i=0;i<equipos.length;i++){
 for(let j=i+1;j<equipos.length;j++){
  partidos.push({local:equipos[i],visitante:equipos[j]});
  partidos.push({local:equipos[j],visitante:equipos[i]});
 }
}

let goleadores=[
{nombre:"Mayta Gabriel",PJ:11,G:33,A:2},
{nombre:"Hugo Mendez",PJ:11,G:16,A:0},
{nombre:"Thiago López",PJ:11,G:5,A:24},
{nombre:"Elias Mendoza",PJ:11,G:2,A:3}
];

if(localStorage.getItem("tablaSerieA")) tabla=JSON.parse(localStorage.getItem("tablaSerieA"));
if(localStorage.getItem("partidosSerieA")) partidos=JSON.parse(localStorage.getItem("partidosSerieA"));
if(localStorage.getItem("goleadoresSerieA")) goleadores=JSON.parse(localStorage.getItem("goleadoresSerieA"));

function mostrarTabla(){
 const cuerpo=document.querySelector("#tablaPosiciones tbody");
 cuerpo.innerHTML="";
 tabla.sort((a,b)=>b.PTS-a.PTS||b.DG-a.DG);

 tabla.forEach((e,i)=>{
  let clase="";
  if(i<4) clase="champions";
  else if(i<6) clase="europa";
  else if(i>=17) clase="descenso";

  cuerpo.innerHTML+=`<tr class="${clase}">
   <td>${i+1}</td><td>${e.nombre}</td><td>${e.PJ}</td>
   <td>${e.G}</td><td>${e.E}</td><td>${e.P}</td>
   <td>${e.GF}</td><td>${e.GC}</td><td>${e.DG}</td>
   <td>${e.PTS}</td></tr>`;
 });
}

function mostrarFaltantes(){
 const ul=document.getElementById("faltantes");
 ul.innerHTML="";
 partidos.forEach(p=>{
  ul.innerHTML+=`<li>${p.local} vs ${p.visitante}</li>`;
 });
}

function agregarResultado(local,visitante,gl,gv){
 if(local===visitante) return alert("Equipos iguales");

 let index=partidos.findIndex(p=>p.local===local&&p.visitante===visitante);
 if(index===-1) return alert("Partido ya jugado");

 let L=tabla.find(e=>e.nombre===local);
 let V=tabla.find(e=>e.nombre===visitante);

 if(L.PJ>=38||V.PJ>=38) return alert("Ya completaron 38 PJ");

 L.PJ++;V.PJ++;
 L.GF+=gl;L.GC+=gv;
 V.GF+=gv;V.GC+=gl;
 L.DG=L.GF-L.GC;
 V.DG=V.GF-V.GC;

 if(gl>gv){L.G++;L.PTS+=3;V.P++;}
 else if(gv>gl){V.G++;V.PTS+=3;L.P++;}
 else{L.E++;V.E++;L.PTS++;V.PTS++;}

 partidos.splice(index,1);

 localStorage.setItem("tablaSerieA",JSON.stringify(tabla));
 localStorage.setItem("partidosSerieA",JSON.stringify(partidos));

 mostrarTabla();
 mostrarFaltantes();
 verificarCampeon();
}

function verificarCampeon(){
 if(tabla.every(e=>e.PJ>=38)){
  tabla.sort((a,b)=>b.PTS-a.PTS||b.DG-a.DG);
  document.getElementById("campeon").innerHTML=
   "🏆 CAMPEÓN: "+tabla[0].nombre+
   "<br>🥈 SUBCAMPEÓN: "+tabla[1].nombre;

  document.getElementById("campeon").style.animation="blink 1s infinite alternate";
  document.getElementById("formResultado").style.display="none";
 }
}

function mostrarGoleadores(){
 goleadores.sort((a,b)=>b.G-a.G);
 const body=document.querySelector("#tablaGoleadores tbody");
 body.innerHTML="";
 goleadores.forEach((g,i)=>{
  body.innerHTML+=`<tr>
   <td>${i+1}. ${g.nombre}</td>
   <td><input type="number" value="${g.PJ}" data-i="${i}" data-c="PJ"></td>
   <td><input type="number" value="${g.G}" data-i="${i}" data-c="G"></td>
   <td><input type="number" value="${g.A}" data-i="${i}" data-c="A"></td>
  </tr>`;
 });

 document.querySelectorAll("#tablaGoleadores input").forEach(inp=>{
  inp.addEventListener("change",e=>{
   let i=e.target.dataset.i;
   let c=e.target.dataset.c;
   goleadores[i][c]=parseInt(e.target.value)||0;
   localStorage.setItem("goleadoresSerieA",JSON.stringify(goleadores));
   mostrarGoleadores();
  });
 });
}

document.getElementById("formResultado").addEventListener("submit",e=>{
 e.preventDefault();
 agregarResultado(
  local.value,
  visitante.value,
  parseInt(golesLocal.value),
  parseInt(golesVisitante.value)
 );
});

document.getElementById("resetTabla").addEventListener("click",()=>{
 localStorage.clear();
 location.reload();
});

equipos.forEach(e=>{
 local.innerHTML+=`<option>${e}</option>`;
 visitante.innerHTML+=`<option>${e}</option>`;
});

mostrarTabla();
mostrarFaltantes();
mostrarGoleadores();
verificarCampeon();

</script>
</body>
</html>
